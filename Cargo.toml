[workspace]
members = [".", "web"]
resolver = "2"

[package]
name = "casio-emu-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Cross-platform Casio nX-U8/100 calculator emulator written in Rust"

[lib]
name = "casio_emu_rs"
path = "src/lib.rs"

[[bin]]
name = "casio-emu-rs"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:minifb", "dep:font8x8", "dep:image"]

[dependencies]
minifb = { version = "0.28", optional = true }
font8x8 = { version = "0.3", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["bmp", "png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
