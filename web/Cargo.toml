[package]
name = "casio-emu-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WebAssembly frontend for casio-emu-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
casio-emu-rs = { path = "..", default-features = false }
wasm-bindgen = "=0.2.130"
console_error_panic_hook = "0.1"
