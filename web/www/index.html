<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casio nX-U8/100 emulator — Rust/WASM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Casio nX-U8/100 emulator</h1>
      <p class="sub">Rust + WebAssembly</p>
    </header>

    <div class="calc-wrap">
      <canvas id="calc" width="289" height="582" aria-label="Casio fx-991ES PLUS C"></canvas>
    </div>

    <div class="controls">
      <label class="file-button">
        Load ROM dump
        <input id="romfile" type="file" accept=".bin,.rom">
      </label>
      <label class="model-picker">
        Model
        <select id="model" title="Switch calculator model">
          <option value="">Auto-detect model</option>
        </select>
      </label>
      <button id="reset">ON</button>
      <span id="status">Load a ROM dump from your own licensed copy to start.</span>
    </div>

    <p class="hint">
      Keyboard: <b>0–9 . + − × ÷ Enter</b>; <b>Backspace</b> DEL; <b>Delete</b>/<b>Esc</b> AC;
      <b>arrows</b>; letters for sin/cos/tan/log/ln/√/x²; <b>F1–F4</b> MODE/SHIFT/ALPHA/ON.
      Click or tap the drawn keys too — touch screens are supported.
    </p>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
