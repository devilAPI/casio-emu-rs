name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: casio-emu-rs-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: casio-emu-rs-windows-x86_64.zip
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: casio-emu-rs-macos-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: casio-emu-rs-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build -p casio-emu-rs --release --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/casio-emu-rs"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${BIN}.exe" dist/
          else
            cp "$BIN" dist/
          fi
          cp README.md LICENSE dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.archive }}" ./dist/*
          else
            tar -czf "${{ matrix.archive }}" -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  web:
    name: Build web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build web app
        run: ./web/build.sh

      - name: Package web
        run: |
          set -euo pipefail
          cd web
          zip -r ../casio-emu-web.zip www

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: casio-emu-web.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: artifacts/*
